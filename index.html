<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบสารสนเทศสำนักศาสนศึกษาวัดพระธาตุศรีจอมทอง</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=b1">
</head>
<body>
<main style="max-width:480px">
  <div class="hero"><img src="img/logo.png" alt="ตราสำนักศาสนศึกษาวัดพระธาตุศรีจอมทอง" width="112" height="112"><h1>ระบบสารสนเทศ<br>สำนักศาสนศึกษาวัดพระธาตุศรีจอมทอง</h1><p>ทะเบียนบุคคล ห้องสมุด และเช็คชื่อนักเรียน</p></div>
  <div id="lineWarn" class="card err" style="display:none">
    เปิดจากแอป LINE อยู่ การเข้าสู่ระบบด้วย Google อาจใช้ไม่ได้<br>
    กรุณากดเมนู ⋮ แล้วเลือก <b>เปิดด้วยเบราว์เซอร์</b> (Chrome / Safari)
  </div>
  <div id="box" class="card"></div>
  <details id="alt"><summary><small>ทางสำรองสำหรับเจ้าของระบบ</small></summary>
    <div class="card"><input id="code" type="password" placeholder="รหัสสำรอง"><div style="height:8px"></div><button id="bCode">เข้าด้วยรหัส</button></div>
  </details>
  <p style="margin-top:24px"><small id="ver"></small></p>
</main>
<script src="config.js"></script>
<script src="common.js?v=b1"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  var C=window.WCTAC, box=document.getElementById('box'), esc=W.esc;
  if(/Line\//i.test(navigator.userAgent)) document.getElementById('lineWarn').style.display='block';
  function showUser(u){
    var canReg=(u.role==='owner'||u.role==='librarian'||u.role==='teacher'||u.role==='assistant');
    box.innerHTML='<b class="ok">เข้าสู่ระบบแล้ว ✓</b><p>'+esc(u.name)+' · '+esc(u.email)+'<br>บทบาท: '+esc(W.ROLE[u.role]||u.role)+'</p>'+
      '<div class="menu">'+
      '<a href="people.html" class="'+(canReg?'':'off')+'"><b>ทะเบียนบุคคล</b><br><small>นักเรียน ครู ชั้นเรียน บัตร QR</small></a>'+
      '<a href="library.html" class="'+((u.role==='owner'||u.role==='librarian')?'':'off')+'"><b>จัดการหนังสือ</b><br><small>ทะเบียนหนังสือ นำเข้า Excel ป้าย QR</small></a>'+
      (u.role==='owner'?'<a href="users.html"><b>จัดการผู้ใช้</b><br><small>เพิ่ม/ปิดสิทธิ์ผู้ดูแล ครู</small></a>':'')+
      '<a href="search.html"><b>ค้นหาหนังสือ</b><br><small>ดูว่ามีเล่มไหน ว่างหรือไม่</small></a>'+
      '<a href="attend.html" class="'+(canReg?'':'off')+'"><b>เช็คชื่อ</b><br><small>เช็คชื่อเข้าเรียนรายชั้น</small></a>'+
      '<a href="attend-report.html" class="'+(canReg?'':'off')+'"><b>รายงานเช็คชื่อ</b><br><small>รายเดือน พิมพ์ / Excel</small></a></div>'+
      '<p style="margin-top:14px"><button id="bOut">ออกจากระบบ</button></p>';
    document.getElementById('bOut').onclick=W.logout;
    document.getElementById('alt').style.display='none';
  }
  function handle(r){
    if(r.denied){box.innerHTML='<b class="err">บัญชีนี้ยังไม่ได้รับอนุญาต</b><p>'+esc(r.email)+'</p><p>กรุณาแจ้งเจ้าของระบบให้เพิ่มอีเมลนี้ในรายชื่อ</p><button id="bBack">กลับ</button>';document.getElementById('bBack').onclick=showLogin;return}
    W.setToken(r.token);showUser(r.user);
  }
  function showLogin(){
    box.innerHTML='<p>เข้าสู่ระบบด้วยบัญชี Google</p><div id="gbtn"></div><p id="msg" class="err"></p>';
    var n=0,t=setInterval(function(){
      if(window.google&&google.accounts&&google.accounts.id){clearInterval(t);
        google.accounts.id.initialize({client_id:C.CLIENT_ID,callback:function(resp){
          document.getElementById('msg').textContent='กำลังตรวจสอบ...';
          W.raw('login',[resp.credential]).then(handle,function(e){document.getElementById('msg').textContent=e.message});
        }});
        google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large',text:'signin_with',locale:'th'});
      } else if(++n>100){clearInterval(t);document.getElementById('msg').textContent='โหลดระบบ Google ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช'}
    },100);
  }
  document.getElementById('bCode').onclick=function(){
    W.raw('loginCode',[document.getElementById('code').value]).then(handle,function(e){alert(e.message)});
  };
  W.raw('getVersion').then(function(v){document.getElementById('ver').textContent='เวอร์ชันระบบ '+v},function(){});
  if(W.token()){box.textContent='กำลังตรวจสอบ...';W.raw('me',[W.token()]).then(showUser,function(){W.setToken(null);showLogin()})}
  else showLogin();
})();
</script>
</body>
</html>
